name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vega:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vega
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vega/package-lock.json
      - run: npm ci
      - run: npm run test:security
      - run: npm test
      - run: npm run lint

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t cinemastamps-ci .
      - run: docker run --rm --entrypoint pnpm cinemastamps-ci test
